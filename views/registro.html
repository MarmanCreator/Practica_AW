<!-- Indicamos que el documento esta en html  -->
<!DOCTYPE html> 
<!-- Indicamos que el idioma principal es el español  -->
<html lang="es">

<!-- Comienzo de la sección head -->
 <head> 
        <meta charset="UTF-8">
        <title>Mi pagina</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Para poner un logo simplemente sería cambiar la ruta de href.  -->
        <link rel="icon" href="/../recurso-imagenes/personas_1/22222B.JPG" type="image/JPG"> 
        <link rel="stylesheet" href="../css/style.css"> 
 </head>

<!-- Comienza el cuarpo donde metemos el formulario -->
<body>
    
    <form action="/registro" method="post">
        Aqui importante añadir el atributo id ="nombre" para que el input pille la etiqueta.
       <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        <br>
        <br>
        
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
        <br>
        <br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        <br>
        <br>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
        <br> 
        <br>
        
        <label for="confirm_password">Confirmar contraseña:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar contraseña" required>
        <br>
        <br>
        
        <label for="rol">Rol:</label>
        <select id="rol" name="rol" required>
            <option value="estudiante">Estudiante</option>
            <option value="administrador">Administrador</option>
        </select>
        <br>
        <br>
        
        <button type="button" onclick="window.location.href='menu_inicio.html'">Cancelar</button>
        <button type="submit">Registrarse</button> 
       
    </form>

</body>
</html>
