<!DOCTYPE html> 
<html lang="es">

 <head> 
        <meta charset="UTF-8">
        <title>Registro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/recurso-imagenes/personas_2/steveCurros.png" type="image/PNG"> 
        <link rel="stylesheet" href="/css/style.css"> 
 </head>

<body>
    <header>
            <h1>Web de administracion de escuela</h1>
    </header>
    <a href="menu_inicio.html">>Inicio</a>
    <form class="formulario_base" id="registro" action="#" method="post">

       <label for="nombre">Nombre:*</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido">
        
        <label for="email">Email:*</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        
        <label for="password">Contraseña:*</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
        
        <label for="confirm_password">Confirmar contraseña:*</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar contraseña" required>
        
        <label for="rol">Rol:*</label>
        <select id="rol" name="rol" required>
            <option value="estudiante">Estudiante</option>
            <option value="administrador">Administrador</option>
        </select>
        
        <button type="button" onclick="window.location.href='menu_inicio.html'">Cancelar</button>
        <button type="submit">Registrarse</button> 
    </form>
    <footer>Este es el pie de pagina de inicio (por completar)
        <button type="button" onclick="window.location.href='formulario_contacto.html'">Contacta con nosotros</button>

    </footer>
</body>
</html>
