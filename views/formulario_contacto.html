        <main>
            <a href="menu_inicio.html">>Inicio</a>
            <form class="formulario_base" id="formulario_contacto" action="#" method="post">

            <label for="nombre">Introduce tu nombre:*</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        
            <label for="email">Introduce tu email:*</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

            <label for="telefono">Introduce tu número de teléfono:*</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ejemplo: 123456789" 
                inputmode="numeric" pattern="[0-9]{9}" maxlength="9" required>
        
            <label for="motivo">Motivo de contacto:*</label>
            <select id="motivo" name="motivo" required>
                <option value="consulta">Consulta</option>
                <option value="sugerencia">Sugerencia</option>
                <option value="reclamo">Reclamo</option>
                <option value="otro">Otro</option>
            </select>

            <label for="asunto">Asunto:*</label>
            <input type="text" id="asunto" name="asunto" placeholder="Asunto de tu mensaje" required>

            <label for="mensaje">Mensaje:*</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>

            <button type="button" onclick="window.location.href='menu_inicio.html'">Cancelar</button>
            <button type="submit" onclick="window.location.href='#'">Enviar consulta</button> 
       
    </form>
        </main>
        <footer>Pagina de formulario de contacto</footer>
